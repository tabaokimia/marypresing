*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding-bottom:30px}
header{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,var(--pk),var(--pk2));color:#fff;padding:14px 16px 20px;border-radius:0 0 26px 26px;border-bottom:4px solid var(--gd);box-shadow:0 8px 20px rgba(184,15,99,.3)}
header img{width:72px;height:72px;border-radius:18px;border:3px solid #f1d58f;background:#fff;object-fit:contain;flex:none}
header h1{margin:0;font:700 1.1rem Georgia,serif;text-transform:uppercase;letter-spacing:.05em}header p{margin:0;font:italic .95rem Georgia,serif}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 8px 22px rgba(224,20,122,.12);margin-bottom:14px}
input,textarea{width:100%;border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;font:inherit;background:var(--bg);color:var(--tx)}
input{font-size:1.4rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;text-align:center}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 18px;color:#fff;background:linear-gradient(135deg,var(--pk),var(--pk2));box-shadow:0 5px 12px rgba(224,20,122,.3);cursor:pointer}
button.s{background:var(--card);color:var(--pk);border:1.5px solid var(--pk);box-shadow:none}
.full{width:100%;margin-top:10px}.mu{color:var(--mu);font-size:.85rem}.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.bar b{flex:1}
.bar button{padding:8px 14px;font-size:.85rem}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1;background:var(--card);color:var(--mu);box-shadow:none;border:1.5px solid var(--bd)}.tabs button.on{background:linear-gradient(135deg,var(--pk),var(--pk2));color:#fff;border-color:var(--pk)}
.tabs i{font-style:normal;background:rgba(0,0,0,.12);border-radius:99px;padding:1px 8px;margin-left:4px;font-size:.8rem}
.lv{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 6px 18px rgba(0,0,0,.08);margin-bottom:12px;border-left:7px solid var(--pk)}
.lv.en_route{border-left-color:#2979ff}.lv.livree{border-left-color:#12a150;opacity:.85}.lv.probleme{border-left-color:#e53935}
.lh{display:flex;justify-content:space-between;gap:8px;align-items:center}.lh b{font-size:1.15rem}
.tg{font-size:.75rem;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--tint);color:var(--pk);white-space:nowrap}
.en_route .tg{background:#e3eeff;color:#1b5fd1}.livree .tg{background:#dcf5e5;color:#12803f}.probleme .tg{background:#ffe3e6;color:#b3261e}
.ad,.ph,.rs{margin-top:8px}.ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.go{display:inline-block;margin-left:6px;font-weight:700;color:var(--pk);text-decoration:none;border:1.5px solid var(--pk);border-radius:99px;padding:2px 10px;font-size:.8rem}
.ics{display:flex;gap:8px}.ci{width:44px;height:44px;border-radius:14px;background-color:#fff;background-repeat:no-repeat;background-position:center;box-shadow:0 3px 8px rgba(0,0,0,.2);border:2px solid var(--bd);display:inline-block}

.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.act button{flex:1;min-width:110px;padding:11px 8px;font-size:.9rem}
.nb{margin-top:10px}.nb textarea{min-height:64px}.empty{text-align:center;color:var(--mu);padding:26px 10px}
#msg{position:fixed;left:12px;right:12px;bottom:14px;background:var(--tx);color:var(--bg);border-radius:14px;padding:12px 14px;display:none;z-index:9;max-width:600px;margin:0 auto}
.fee{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--tint)}.fee label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}.fr{display:flex;gap:8px}
input.fi{font-size:1.1rem;letter-spacing:0;text-transform:none;text-align:left;font-weight:700;flex:1;min-width:0}
button.wab{background:#25d366;color:#073b1b;box-shadow:none;display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:.88rem;white-space:nowrap}
button.wab::before{content:"";width:24px;height:24px;border-radius:50%;background:var(--wa) center/cover}
.nf{font-size:1rem!important;letter-spacing:0!important;text-transform:none!important;text-align:left!important;font-weight:400!important;margin-bottom:8px}
.del{display:block;width:100%;margin-top:10px;background:transparent;border:1.5px solid #d32f2f;color:#d32f2f;box-shadow:none;border-radius:999px;padding:9px 12px;font-size:.88rem;font-weight:700;text-decoration:none}.del.arm{background:#d32f2f;color:#fff}
select.nf{width:100%;border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;font:inherit;background:var(--bg);color:var(--tx);margin-bottom:8px}.tabs.sec button{font-size:1rem;padding:14px 10px}.cph{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gd);flex:none}.lh{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.lh .hn{display:flex;align-items:center;gap:10px;min-width:0}.lh .hn small{display:block;color:var(--mu);font-size:.78rem;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.chev{transition:transform .3s;font-size:1.5rem;line-height:1;color:var(--pk);margin-left:8px;font-weight:700}.lv.open .chev{transform:rotate(90deg)}
.cb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}.lv.open .cb{grid-template-rows:1fr}.cbi{overflow:hidden;min-height:0}.cbi>:first-child{margin-top:10px}</style></head><body>

  for(let i=16;i<64;i++){const s0=r(7,w[i-15])^r(18,w[i-15])^(w[i-15]>>>3),s1=r(17,w[i-2])^r(19,w[i-2])^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
  let a=h[0],bb=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
  for(let i=0;i<64;i++){const S1=r(6,e)^r(11,e)^r(25,e),ch=(e&f)^(~e&g),t1=(hh+S1+ch+k[i]+w[i])|0,S0=r(2,a)^r(13,a)^r(22,a),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
  h[0]=(h[0]+a)|0;h[1]=(h[1]+bb)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0}
 return h.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}

const rdAcc=()=>{try{return JSON.parse(localStorage.getItem("mps_livreurs")||"[]")}catch(e){return[]}};
const dgt=x=>String(x||"").replace(/\D/g,""),sameTel=(a,b)=>{a=dgt(a);b=dgt(b);return a.length>=8&&b.length>=8&&a.slice(-8)===b.slice(-8)};

let armedDel=null,armedT=null,openC={},rows=ld("liv_rows","[]"),fees=ld("liv_fees","{}"),tab="A",sec="livraison",opened={},draft={};
function saveRows(){try{const cur=ld("liv_rows","[]"),ids=new Set(cur.map(x=>x.id));rows=rows.filter(r=>ids.has(r.id));cur.forEach(x=>{if(!rows.some(r=>r.id===x.id))rows.push(x)});localStorage.setItem("liv_rows",JSON.stringify(rows))}catch(e){}}

function waNum(tel){const raw=String(tel||"").trim();let d=raw.replace(/\D/g,"");if(!d)return"";if(raw[0]!=="+"){if(d.startsWith("00"))d=d.slice(2);else if(!d.startsWith("242"))d="242"+d}return d}
function cia(tel){const lc=String(tel||"").replace(/[^\d+]/g,""),d=waNum(tel);if(!lc)return"";
 return `<a class="ci call" href="tel:${esc(lc)}" aria-label="Appeler"></a><a class="ci wa" href="https://wa.me/${d}" target="_blank" rel="noopener" aria-label="WhatsApp"></a>`}
function card(r){const fin=r.statut==="livree",o=opened[r.id],fe=fees[r.id],fv=draft[r.id]!==undefined?draft[r.id]:(fe?fe.m:"");
 return `<div class="lv ${r.statut}${openC[r.id]?" open":""}"><div class="lh" data-tg="${esc(r.id)}"><div class="hn">${r.photo?`<img class="cph" src="${r.photo}" alt="">`:""}<div style="min-width:0"><b>${esc(r.nom)}</b><small>📍 ${esc(r.adr||"Adresse non précisée")}</small></div></div><span style="display:flex;align-items:center;flex:none"><span class="tg">${esc(lab(r))}</span><span class="chev">›</span></span></div>
 <div class="cb"><div class="cbi">
 <div class="mu">Commande ${esc(r.commande)}</div>
 <div class="ad">📍 ${r.adr?esc(r.adr)+`<a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.adr)}">Itinéraire</a>`:"<i>Adresse non précisée</i>"}</div>
 <div class="ph"><span>📞 ${esc(r.tel)}</span><span class="ics">${cia(r.tel)}</span></div>
 ${r.resume?`<div class="rs">🧺 ${esc(r.resume)}</div>`:""}
 ${typ(r)==="livraison"&&r.solde!==undefined?`<div class="rs" style="font-weight:700;color:var(--pk)">${r.solde>0?"💰 Solde à payer : "+fmt(r.solde):"✅ Déjà payé, rien à encaisser"}</div>`:""}
 <div class="fee"><label>🏍️ Montant de la course (FCFA)</label><div class="fr"><input class="fi" type="number" inputmode="numeric" min="0" placeholder="Ex. 1500" data-fee="${esc(r.id)}" value="${esc(fv)}"><button class="wab" data-send="${esc(r.id)}">Envoyer au client</button></div>${fe?`<div class="mu" style="margin-top:6px">✅ ${fmt(fe.m)} envoyé au client le ${new Date(fe.t).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div>`:""}</div>
 ${r.note_livreur?`<div class="mu" style="margin-top:6px">Note livreur : ${esc(r.note_livreur)}</div>`:""}
 ${fin?`<div class="mu" style="margin-top:6px">Terminée le ${new Date(r.updated_at).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</div><div class="act"><button class="s" data-a="a_livrer" data-id="${r.id}">↩ Remettre à faire</button></div>`
 :`<div class="act"><button data-a="en_route" data-id="${r.id}">🏍️ En route</button><button data-a="livree" data-id="${r.id}">✅ ${typ(r)==="collecte"?"Collectée":"Livrée"}</button><button class="s" data-pb="${r.id}">⚠ Problème</button></div>
 ${o?`<div class="nb"><textarea id="n-${r.id}" placeholder="Décrivez le problème (client absent, adresse introuvable…)">${esc(r.note_livreur||"")}</textarea><button class="full" data-a="probleme" data-id="${r.id}">Envoyer le problème</button></div>`:""}`}
 <button class="del${armedDel===r.id?" arm":""}" data-del="${r.id}">${armedDel===r.id?"⚠ Confirmer la suppression":"🗑 Supprimer cette "+(typ(r)==="collecte"?"collecte":"livraison")}</button></div></div></div>`}
function render(){const pend=t=>rows.filter(r=>typ(r)===t&&r.statut!=="livree"&&mine(r)).length;$("cC").textContent=pend("collecte");$("cV").textContent=pend("livraison");
 $("sC").classList.toggle("on",sec==="collecte");$("sV").classList.toggle("on",sec==="livraison");$("tAl").textContent=sec==="collecte"?"À collecter":"À livrer";
 const S=rows.filter(r=>typ(r)===sec&&mine(r)),A=S.filter(r=>r.statut!=="livree"),L=S.filter(r=>r.statut==="livree");
 $("nA").textContent=A.length;$("nL").textContent=L.length;const list=tab==="A"?A:L;
 $("list").innerHTML=list.length?list.map(card).join(""):`<div class="empty">${tab==="A"?(sec==="collecte"?"Aucune collecte en attente. Les collectes envoyées par l’administrateur apparaîtront ici. 🎉":"Aucune livraison en attente. Les livraisons envoyées par l’administrateur apparaîtront ici. 🎉"):"Rien de terminé pour le moment."}</div>`}
$("ref").onclick=()=>{rows=ld("liv_rows","[]");render();say("Liste actualisée.")};
$("sC").onclick=()=>{sec="collecte";render()};$("sV").onclick=()=>{sec="livraison";render()};
$("tA").onclick=()=>{tab="A";$("tA").classList.add("on");$("tL").classList.remove("on");render()};
$("tL").onclick=()=>{tab="L";$("tL").classList.add("on");$("tA").classList.remove("on");render()};
$("list").oninput=e=>{const f=e.target.closest("[data-fee]");if(f)draft[f.dataset.fee]=f.value};
$("list").onclick=e=>{
 const tg=e.target.closest("[data-tg]");if(tg&&!e.target.closest("a")){const id=tg.dataset.tg;openC[id]=!openC[id];tg.closest(".lv").classList.toggle("open",!!openC[id]);return}
 const sd=e.target.closest("[data-send]");if(sd){const id=sd.dataset.send,r=rows.find(x=>x.id===id);if(!r)return;const inp=document.querySelector('[data-fee="'+CSS.escape(id)+'"]'),m=Math.round(+(inp&&inp.value));
  if(!(m>0))return say("Saisissez le montant de la course.");const n=waNum(r.tel);if(!n)return say("Pas de numéro WhatsApp pour ce client.");
  const msg=typ(r)==="collecte"?"Bonjour cher(e) "+r.nom+" 👋,\nNous vous confirmons la bonne réception de votre commande chez Mary's Service Pressing.\n💰 Montant de la course : "+fmt(m)+"\n🚚 Notre équipe est impatiente de s'occuper de votre linge avec le plus grand soin.\nMerci pour votre confiance et votre fidélité à Mary's Service Pressing. ❤️\nLe Livreur":"🏍️ *MARY'S SERVICE PRESSING*\nBonjour cher(e) "+r.nom+" 👋,\nLe montant de la course pour la livraison de votre commande "+r.commande+" est de "+fmt(m)+".\nMerci pour votre confiance et votre fidélité à Mary's Service Pressing. ❤️\nLe Livreur";
  fees[id]={m,t:Date.now()};saveFees();delete draft[id];window.open("https://wa.me/"+n+"?text="+encodeURIComponent(msg),"_blank");render();say("WhatsApp ouvert : appuyez sur Envoyer pour prévenir le client.");return}
 const dl=e.target.closest("[data-del]");if(dl){const id=dl.dataset.del,r=rows.find(x=>x.id===id);if(!r)return;
  if(armedDel!==id){armedDel=id;render();clearTimeout(armedT);armedT=setTimeout(()=>{armedDel=null;render()},4000);return}
  armedDel=null;clearTimeout(armedT);rows=rows.filter(x=>x.id!==id);delRow(id);
  render();say(typ(r)==="collecte"?"🗑 Collecte supprimée.":"🗑 Livraison supprimée.");return}
 const pb=e.target.closest("[data-pb]");if(pb){opened[pb.dataset.pb]=!opened[pb.dataset.pb];render();return}
 const b=e.target.closest("[data-a]");if(!b)return;const id=b.dataset.id,a=b.dataset.a,r=rows.find(x=>x.id===id);if(!r)return;
 if(a==="livree"&&!confirm((typ(r)==="collecte"?"Confirmer la collecte chez ":"Confirmer la livraison à ")+r.nom+" ?"))return;
 if(a==="probleme"){const note=($("n-"+id)||{}).value||"";if(!note.trim())return say("Décrivez brièvement le problème.");r.note_livreur=note}
 r.statut=a;r.updated_at=new Date().toISOString();opened[id]=false;saveRows();render();
 say(a==="livree"?(typ(r)==="collecte"?"Collecte confirmée ✅":"Livraison confirmée ✅"):a==="en_route"?"Marquée « en route ».":a==="probleme"?"Problème signalé.":"Remise à livrer.")};
function importer(){const m=location.hash.match(/^#tache=(.+)$/);if(!m)return;let j;
 try{const b=m[1].replace(/-/g,"+").replace(/_/g,"/");j=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b+"=".repeat((4-b.length%4)%4)),c=>c.charCodeAt(0))))}catch(e){say("Lien invalide.");return}
 try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
 if(!j||!j.i||!j.n)return say("Lien invalide.");const t=j.t==="collecte"?"collecte":"livraison";
 const info={type:t,commande:j.k||"Commande en ligne",nom:j.n,tel:j.p||"",adr:j.a||"",resume:j.r||""};if(t==="livraison")info.solde=+j.s||0;
 const ex=rows.find(r=>r.id===j.i);if(ex)Object.assign(ex,info);else rows.unshift(Object.assign({id:j.i,statut:"a_livrer",updated_at:new Date().toISOString()},info));
 saveRows();sec=t;tab="A";$("tA").classList.add("on");$("tL").classList.remove("on");render();say(ex?"Mission mise à jour.":(t==="collecte"?"📦 Nouvelle collecte reçue.":"🚚 Nouvelle livraison reçue."))}
window.addEventListener("hashchange",importer);
function syncRows(){const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA/.test(ae.tagName))return;const n=ld("liv_rows","[]");if(JSON.stringify(n)===JSON.stringify(rows))return;
 const had=new Set(rows.map(r=>r.id)),add=n.filter(r=>!had.has(r.id)&&mine(r)),gone=rows.filter(r=>mine(r)&&!n.some(x=>x.id===r.id));rows=n;render();
 if(add.length)say(add.length>1?"Nouvelles missions reçues.":(add[0].type==="collecte"?"📦 Nouvelle collecte reçue.":"🚚 Nouvelle livraison reçue."));else if(gone.length)say("🗑 Une mission a été retirée par l’administrateur.")}
window.addEventListener("storage",e=>{if(e.key==="liv_rows")syncRows()});document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncRows()});setInterval(()=>syncRows(),3000);
render();importer();
$("lgok").onclick=()=>{const t=$("lgtel").value,pw=$("lgpw").value.trim(),a=rdAcc().find(x=>sameTel(x.tel,t));
 if(!a||sha256(a.salt+pw)!==a.hash){$("lgerr").textContent="Numéro ou mot de passe incorrect.";return}
 try{localStorage.setItem(SESSK,a.id)}catch(e){}$("lgpw").value="";$("lgerr").textContent="";enter()};

// ===== MODE EN LIGNE (Supabase) : missions partagées par internet =====
if(typeof SB!=='undefined'&&SB.enabled){
 const enc=encodeURIComponent;let snap={},online=true;
 const toRow=m=>{const d=m.data||{};return{id:m.id,type:m.type,commande:d.commande||'',nom:d.nom||'',tel:d.tel||'',adr:d.adr||'',resume:d.resume||'',solde:d.solde,photo:d.photo,statut:m.statut,note_livreur:m.note||'',updated_at:m.updated_at,livreur:SESS&&SESS.id}};
 enter=async function(){if(enter.busy)return;const ses=SB.session('l');
  if(!ses){SESS=null;$("lg").hidden=false;$("app").hidden=true;return}
  if(SESS&&SESS.uid===ses.uid){$("lg").hidden=true;$("app").hidden=false;return}
  enter.busy=1;try{const me=await SB.req('l','GET','livreurs?select=id,nom&limit=1');
   if(!me||!me.length){SB.logout('l');SESS=null;$("lgerr").textContent="Compte livreur introuvable : demandez à l'administrateur.";$("lg").hidden=false;$("app").hidden=true;return}
   SESS={id:me[0].id,nom:me[0].nom,uid:ses.uid};$("lg").hidden=true;$("app").hidden=false;$("who").textContent="🏍️ "+SESS.nom;syncRows.sig="";await syncRows(true)}
  catch(e){if(/expir|JWT/i.test(e.message)){SB.logout('l');SESS=null;$("lg").hidden=false;$("app").hidden=true}else $("lgerr").textContent=e.message}finally{enter.busy=0}};
 syncRows=async function(force){if(!SESS)return;const ae=document.activeElement;if(!force&&ae&&/INPUT|TEXTAREA/.test(ae.tagName))return;
  try{const lite=await SB.req('l','GET','missions?select=id,statut,note,updated_at&order=updated_at.desc&limit=80')||[];online=true;const sig=JSON.stringify(lite);
   if(sig===syncRows.sig&&!force){lkRender();return}
   const r=await SB.req('l','GET','missions?select=*&order=updated_at.desc&limit=80')||[];syncRows.sig=sig;const n=r.map(toRow);
   const had=new Set(rows.map(x=>x.id)),add=n.filter(x=>!had.has(x.id)),gone=rows.filter(x=>!n.some(y=>y.id===x.id));rows=n;snap={};n.forEach(x=>snap[x.id]={s:x.statut,n:x.note_livreur||''});render();
   if(!force){if(add.length)say(add.length>1?"Nouvelles missions reçues.":(add[0].type==="collecte"?"📦 Nouvelle collecte reçue.":"🚚 Nouvelle livraison reçue."));else if(gone.length)say("🗑 Une mission a été retirée par l’administrateur.")}}
  catch(e){online=false;if(/expir|JWT/i.test(e.message)){SB.logout('l');SESS=null;enter()}}lkRender()};
 saveRows=function(){rows.forEach(r=>{const o=snap[r.id];if(o&&(o.s!==r.statut||o.n!==(r.note_livreur||''))){snap[r.id]={s:r.statut,n:r.note_livreur||''};
  SB.req('l','PATCH','missions?id=eq.'+enc(r.id),{statut:r.statut,note:r.note_livreur||'',updated_at:new Date().toISOString()},{Prefer:'return=minimal'}).then(()=>{syncRows.sig=""}).catch(e=>say('⚠ '+e.message))}})};
 delRow=function(id){SB.req('l','DELETE','missions?id=eq.'+enc(id),undefined,{Prefer:'return=minimal'}).then(()=>{syncRows.sig=""}).catch(e=>say('⚠ '+e.message))};
 lkRender=function(){const e=$("lkst");if(e)e.innerHTML=online?"🟢 Connecté : vous recevez les missions en direct.":"🔴 Pas de connexion internet : les missions ne sont plus mises à jour."};
 $("lgok").onclick=async()=>{const t=$("lgtel").value.trim(),pw=$("lgpw").value.trim();if(!t||!pw){$("lgerr").textContent="Saisissez votre numéro et votre mot de passe.";return}
  try{const al=await SB.rpc('login_alias',{p_tel:t});if(!al)throw new Error('invalid');await SB.login('l',al,pw);$("lgpw").value="";$("lgerr").textContent="";SESS=null;await enter()}
  catch(e){$("lgerr").textContent=/invalid|credentials/i.test(e.message)?"Numéro ou mot de passe incorrect.":e.message}};
 $("quit").onclick=()=>{SB.logout('l');SESS=null;rows=[];snap={};render();enter()};
 lkRender();enter();
}
